<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rainbow Bites</title>
    <link rel="stylesheet" href="/styles/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Audiowide&family=Share+Tech+Mono&display=swap" rel="stylesheet">

</head>

<body>

<div id="container-login">

    <div id="card-login">

        <h1 id="titulo-login">Rainbow Login</h1>

        <form>

            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" placeholder="E-mail">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Senha">
            </div>

            <button type="submit" id="botao-login">Entrar</button>

        </form>

        <p id="extra">
            Não tem conta? <a href="#">Criar agora</a>
        </p>

        <a href="/index.html" id="voltar">
            <i class="fa-solid fa-arrow-rotate-left"></i> Continuar como convidado.
        </a>

    </div>

</div>

</body>
</html>
