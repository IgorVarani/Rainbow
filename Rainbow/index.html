<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainbow Bites</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Audiowide&family=Share+Tech+Mono&display=swap" rel="stylesheet">

</head>
<body>

<header>

<!-------------------------
====== MENU LATERAL =======
--------------------------->

<button id="botao-menu">&#9776;</button>

<div id="div-menu" class="oculto1">
    <!--* <nav> é o menu hambúrguer ou menu lateral. -->
    <nav id="nav-menu">
        <ul id="menu-itens">
            <li><a href="" class="linkMenu">Cardápio</a></li>
            <li><a href="" class="linkMenu">Lançamentos</a></li>
        </ul>
    </nav>
</div>

<script src="/js/menu.js"></script> <!-- JS do menu Hambúrguer. -->

<!-------------------------
===== TÍTULO/SUBTÍTULO ====
--------------------------->

<div id="div-titulo">
    <h1 id="titulo">Rainbow Bites</h1>
        <ul id="ul-titulo">
            <li class="liTitulo"><a href="#" class="linkTitulo">Cardápio</a></li>
            <li class="liTitulo"><a href="#" class="linkTitulo">Lançamentos</a></li>
        </ul>
    <h2 id="subtitulo">Com quantas cores você quer o seu pedido hoje?</h2>
    <button id="botao-iniciar-pedido">Iniciar Pedido</button>
</div>

<!-------------------------
========== PEDIDO =========
--------------------------->

<div id="div-pedido" class="oculto2">
    <div id="conteudo-pedido">
        <p id="titulo-pedido">Monte o pedido mais colorido de todos:</p>

        <label class="labelPedido">Hambúrguer:</label>
        <select class="selectPedido">
            <option class="optionPedido">RGBurger</option>
            <option class="optionPedido">Duplo Arco-íris</option>
            <option class="optionPedido">Rainbow Ultra Bacon</option>
        </select>

        <br><br>

        <label class="labelPedido">Acompanhamento:</label>
        <select class="selectPedido">
            <option class="optionPedido">Rainbow Fries</option>
            <option class="optionPedido">RGB Nuggets</option>
        </select>

        <br><br>

        <label class="labelPedido">Bebida:</label>
        <select class="selectPedido">
            <option class="optionPedido">Coca-Cola Arco-íris</option>
            <option class="optionPedido">Rainbow Shake</option>
        </select>

        <br><br>

        <button id="botao-fechar-pedido">Fechar Pedido</button>
    </div>
</div>

<script src="/js/pedido.js"></script> <!-- JS do Pedido. -->

</header>

<!-------------------------
======== CARROSSEL ========
--------------------------->

<div id="div-carrossel">
    <button id="botao-anterior">&#10094;</button>

    <div id="div-slides">
        <img src="/assets/img/Rainbow Burger.png" class="slide ativo">
        <img src="/assets/img/Rainbow Burger Bacon.png" class="slide">
        <img src="/assets/img/Rainbow Burger Double.png" class="slide" id="burger-double">
        <img src="/assets/img/Rainbow Fries.png" class="slide">
        <img src="/assets/img/Rainbow Milkshake.png" class="slide">
        <img src="/assets/img/Rainbow Nuggets.png" class="slide">
        <img src="/assets/img/Rainbow Soda.png" class="slide">
    </div>

    <button id="botao-proximo">&#10095;</button>
</div>
    
<script src="/js/carrossel.js"></script> <!-- JS do Carrossel. -->

<!-------------------------
======== ????????? ========
--------------------------->

</body>
</html>
